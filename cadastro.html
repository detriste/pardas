<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - Pardas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --border: #2e2e42;
      --accent: #6c63ff;
      --accent-hover: #857dff;
      --text: #e8e8f0;
      --muted: #7a7a99;
      --success: #4ade80;
      --error: #f87171;
    }
    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    body::before {
      content: '';
      position: fixed;
      top: -200px; left: -200px;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(108,99,255,0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .logo h1 {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo h1 span { color: var(--accent); }
    .logo p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .input-group { margin-bottom: 16px; }
    .input-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 7px;
    }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: 'Sora', sans-serif;
      transition: border-color 0.2s;
      outline: none;
    }
    .input-group input:focus { border-color: var(--accent); }
    .input-group input::placeholder { color: var(--muted); }
    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Sora', sans-serif;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s, transform 0.1s;
    }
    button[type="submit"]:hover { background: var(--accent-hover); }
    button[type="submit"]:active { transform: scale(0.98); }
    .mensagem {
      margin-top: 14px;
      text-align: center;
      font-size: 13px;
      min-height: 18px;
    }
    .sucesso { color: var(--success); }
    .erro { color: var(--error); }
    .link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--muted);
    }
    .link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .link a:hover { color: var(--accent-hover); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <h1>par<span>das</span></h1>
      <p>Crie sua conta</p>
    </div>

    <form id="formCadastro">
      <div class="input-group">
        <label>Nome</label>
        <input type="text" id="nome" placeholder="Seu nome completo" required>
      </div>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="seu@email.com" required>
      </div>
      <div class="input-group">
        <label>Senha</label>
        <input type="password" id="senha" placeholder="••••••••" required>
      </div>
      <button type="submit">Criar conta</button>
    </form>

    <p class="mensagem" id="msg"></p>

    <div class="link">
      Já tem conta? <a href="login.html">Entrar</a>
    </div>
  </div>

  <script>
    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const msg = document.getElementById('msg');

      try {
        const res = await fetch('http://localhost:3000/usuarios', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, email, senha })
        });
        const data = await res.json();
        msg.textContent = data.mensagem || data.erro;
        msg.className = 'mensagem ' + (res.ok ? 'sucesso' : 'erro');
        if (res.ok) {
          setTimeout(() => window.location.href = 'login.html', 1500);
        }
      } catch {
        msg.textContent = 'Erro ao conectar com o servidor.';
        msg.className = 'mensagem erro';
      }
    });
  </script>
</body>
</html>
