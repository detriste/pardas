<ion-content class="cadastro-content">
  <div class="cadastro-wrapper">
    <div class="cadastro-card">
      <h2 class="cadastro-title">Sistema de Gestão de Estoque</h2>
      <p class="cadastro-subtitle">Criar nova conta</p>

      <div class="form-group">
        <label class="field-label">Nome</label>
        <ion-input
          class="custom-input"
          type="text"
          placeholder="Digite seu nome"
          [(ngModel)]="nome"
          clearInput
        ></ion-input>
      </div>

      <div class="form-group">
        <label class="field-label">E-mail</label>
        <ion-input
          class="custom-input"
          type="email"
          placeholder="Digite seu e-mail"
          [(ngModel)]="email"
          clearInput
        ></ion-input>
      </div>

      <div class="form-group">
        <label class="field-label">Senha</label>
        <ion-input
          class="custom-input"
          type="password"
          placeholder="Digite sua senha"
          [(ngModel)]="senha"
          clearOnEdit="false"
        ></ion-input>
      </div>

      <ion-button
        expand="block"
        class="btn-cadastrar"
        (click)="cadastrar()"
      >
        Cadastrar
      </ion-button>

      <p class="link-login">
        Já tem uma conta?
        <span class="link" (click)="irParaLogin()">Entrar</span>
      </p>
    </div>
  </div>
</ion-content>
